# Template: deploy/k8s/prod/web/values.yaml
# PROD sizing often larger than INT (wiplatform: 1Gi/3Gi, HPA 2–4).

name: <APP_NAME>
project: <APP_NAME>

env:
  environment: prod
  region: <AWS_REGION>

deployment:
  enabled: true
  image:
    repository: "<AWS_ACCOUNT_PROD>.dkr.ecr.<AWS_REGION>.amazonaws.com/<APP_NAME>-<AWS_REGION>-prod"
    tag: "bootstrap-pending"
  replicaCount: 2
  containerPort: 3000
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 250m
      memory: 3Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  env:
    config:
      YOYO_APP_ORIGIN: https://<PROD_HOST>
      # Fill from Amplify prod inventory — mark UNKNOWN until confirmed
    secret:
      BETTER_AUTH_SECRET:
        name: <APP_NAME>

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_PROD>:role/<APP_NAME>-<AWS_REGION>-prod"

externalSecret:
  enabled: true
  secretStoreRef: aws-secrets-manager
  awsSecretName: prod/pl-prod-proxy/<APP_NAME>
  data:
    - secretKey: BETTER_AUTH_SECRET
      property: BETTER_AUTH_SECRET

job:
  enabled: false

tekton:
  awsaccountid: "<AWS_ACCOUNT_PROD>"
  sceptrecommands:
    - "sceptre --var ServiceName=<APP_NAME>-<AWS_REGION>-prod --var template_bucket_name=<PROD_CF_TEMPLATE_BUCKET> launch prod/svc/services/ecr -y"
  valuesfile: deploy/k8s/prod/web/values.yaml
  gitrepository: git@github.com:yoyogroup/<REPO>.git
  branch: master
  buildargs:
    - NODE_OPTIONS=--max-old-space-size=1536