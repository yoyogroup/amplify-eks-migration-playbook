# Template: deploy/k8s/int/web/values.yaml
# Replace <PLACEHOLDERS>. Never commit secret values — SM only.
# For full skeleton: copy from yoyo-deals-marketplace-nextjs deploy/k8s/int/web/values.yaml (structure, not values).

name: <APP_NAME>
project: <APP_NAME>

env:
  environment: int
  region: <AWS_REGION>

# serviceMonitor:
#   enabled: false
# prometheusRules:
#   enabled: false
# alerting:
#   enabled: false

deployment:
  enabled: true
  image:
    repository: "<AWS_ACCOUNT_INT>.dkr.ecr.<AWS_REGION>.amazonaws.com/<APP_NAME>-<AWS_REGION>-int"
    tag: "bootstrap-pending"
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 3000
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
  env:
    config:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_OPTIONS: "--max-old-space-size=179"
      YOYO_APP_ORIGIN: https://<INT_HOST>
    secret:
      BETTER_AUTH_SECRET:
        name: <APP_NAME>
  # topologySpreadConstraints:
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway
  #   maxSkew: 1
  # podSecurityContext:
  #   runAsNonRoot: true
  #   runAsUser: 1000
  #   runAsGroup: 1000
  #   fsGroup: 1000
  # securityContext:
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop: ["ALL"]

# poddisruptionbudget:
#   enabled: false

# service:
#   enabled: true
#   type: ClusterIP
#   port: 3000

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_INT>:role/<APP_NAME>-<AWS_REGION>-int"

targetGroupBinding:
  enabled: false

externalSecret:
  enabled: true
  secretStoreRef: aws-secrets-manager
  awsSecretName: int/pl-int-proxy/<APP_NAME>
  data:
    - secretKey: BETTER_AUTH_SECRET
      property: BETTER_AUTH_SECRET

job:
  enabled: false

tekton:
  buildResources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  kanikoBuildFlags:
    - "--use-new-run"
    - "--snapshot-mode=redo"
  kanikoCache: true
  awsaccountid: "<AWS_ACCOUNT_INT>"
  tasks:
    - fetch-repository
    - create-aws-resources
    - build-image
    - imagetag-updater
  docker:
    dockerfile: Dockerfile
  buildargs:
    - NODE_OPTIONS=--max-old-space-size=1536
  sceptrecommands:
    - "sceptre --var ServiceName=<APP_NAME>-<AWS_REGION>-int --var region=<AWS_REGION> --var template_bucket_name=<INT_CF_TEMPLATE_BUCKET> launch int/svc/services/ecr -y"
  valuesfile: deploy/k8s/int/web/values.yaml
  gitrepository: git@github.com:yoyogroup/<REPO>.git
  branch: <INT_TEKTON_BRANCH>