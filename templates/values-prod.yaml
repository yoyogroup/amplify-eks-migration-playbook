# Template: deploy/k8s/prod/web/values.yaml
# Copy optional top-level blocks from peer INT/PROD (serviceMonitor, service, securityContext, PDB).

name: <APP_NAME>
project: <APP_NAME>

env:
  environment: prod
  region: <AWS_REGION>

deployment:
  enabled: true
  image:
    repository: "<AWS_ACCOUNT_PROD>.dkr.ecr.<AWS_REGION>.amazonaws.com/<APP_NAME>-<AWS_REGION>-prod"
    tag: "bootstrap-pending"
    pullPolicy: IfNotPresent
  replicaCount: 2
  containerPort: 3000
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 250m
      memory: 3Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  env:
    config:
      YOYO_APP_ORIGIN: https://<PROD_HOST>
    secret:
      BETTER_AUTH_SECRET:
        name: <APP_NAME>

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_PROD>:role/<APP_NAME>-<AWS_REGION>-prod"

externalSecret:
  enabled: true
  secretStoreRef: aws-secrets-manager
  awsSecretName: prod/pl-prod-proxy/<APP_NAME>
  data:
    - secretKey: BETTER_AUTH_SECRET
      property: BETTER_AUTH_SECRET

job:
  enabled: false

tekton:
  buildResources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  kanikoBuildFlags:
    - "--use-new-run"
    - "--snapshot-mode=redo"
  kanikoCache: true
  awsaccountid: "<AWS_ACCOUNT_PROD>"
  tasks:
    - fetch-repository
    - create-aws-resources
    - build-image
    - imagetag-updater
  docker:
    dockerfile: Dockerfile
  buildargs:
    - NODE_OPTIONS=--max-old-space-size=1536
  sceptrecommands:
    - "sceptre --var ServiceName=<APP_NAME>-<AWS_REGION>-prod --var region=<AWS_REGION> --var template_bucket_name=<PROD_CF_TEMPLATE_BUCKET> launch prod/svc/services/ecr -y"
  valuesfile: deploy/k8s/prod/web/values.yaml
  gitrepository: git@github.com:yoyogroup/<REPO>.git
  # PROD Tekton branch: master or main — match cloud_catalog valueFileRepotargetRevision and repo default.
  branch: <PROD_TEKTON_BRANCH>